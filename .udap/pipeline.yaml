version: 1
name: app
vcs: github
stages:
- id: provision
  kind: provision
  timeout_minutes: 30
  env:
    AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
    AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    AWS_REGION: us-east-1
    TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
    TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
  steps:
  - name: Set up Terraform
    uses: hashicorp/setup-terraform@v3
    with:
      terraform_wrapper: 'false'
  - name: Terraform init
    run: |
      cd infra
      terraform init -input=false -reconfigure \
        -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
        -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
        -backend-config="region=$AWS_REGION"
  - name: Terraform apply
    run: |
      cd infra
      terraform apply -auto-approve -input=false

- id: configure
  kind: configure
  needs:
  - provision
  timeout_minutes: 30
  env:
    AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
    AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    AWS_REGION: us-east-1
    SSH_USER: ${{ secrets.SSH_USER }}
    SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
  steps:
  - name: Set up Terraform
    uses: hashicorp/setup-terraform@v3
    with:
      terraform_wrapper: 'false'
  - name: Read instance address
    id: infra
    run: |
      cd infra
      terraform init -input=false -reconfigure \
        -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
        -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
        -backend-config="region=$AWS_REGION"
      echo "ip=$(terraform output -raw public_ip)" >> "$GITHUB_OUTPUT"
  - name: Install Ansible
    run: pipx install ansible-core
  - name: Write SSH key
    run: |
      mkdir -p ~/.ssh
      printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
      chmod 600 ~/.ssh/deploy_key
  - name: Configure server
    env:
      ANSIBLE_HOST_KEY_CHECKING: 'False'
    run: |
      ansible-playbook -i "${{ steps.infra.outputs.ip }}," -u "$SSH_USER" \
        --private-key ~/.ssh/deploy_key ansible/playbook.yml

- id: verify
  kind: verify
  needs:
  - configure
  timeout_minutes: 15
  steps:
  - name: Health check HTTPS
    run: |
      curl --fail --retry 12 --retry-delay 15 --retry-all-errors \
        "https://www.faizun.hepttech.com/health"
      curl --fail --silent --output /dev/null --retry 6 --retry-delay 10 \
        --retry-all-errors "https://www.faizun.hepttech.com/"

rollback:
  strategy: rerun

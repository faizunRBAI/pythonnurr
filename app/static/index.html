<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>pythonnurr</title>
  <style>
    * { margin: 0; box-sizing: border-box; }
    body { font-family: -apple-system, "Segoe UI", sans-serif; background: #0b0f1a;
           color: #f9fafb; min-height: 100vh; display: grid; place-items: center; }
    main { text-align: center; padding: 2rem; }
    h1 { font-size: 2.2rem; margin-bottom: .6rem; }
    p { color: #9ca3af; margin-bottom: 1.6rem; }
    .ok { display: inline-block; padding: .5rem 1.1rem; border: 1px solid #22d3ee;
          border-radius: 999px; color: #22d3ee; font-size: .9rem; }
    .links { margin-top: 1.4rem; }
    .links a { color: #7dd3fc; text-decoration: none; margin: 0 .6rem; font-size: .9rem; }
    .links a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main>
    <h1>pythonnurr</h1>
    <p>FastAPI behind nginx on AWS EC2 — deployed by UDAP.</p>
    <span class="ok">service healthy — try <code>/health</code></span>
    <div class="links">
      <a href="/health">/health</a>
      <a href="/docs">/docs (Swagger UI)</a>
      <a href="/redoc">/redoc</a>
    </div>
  </main>
</body>
</html>
